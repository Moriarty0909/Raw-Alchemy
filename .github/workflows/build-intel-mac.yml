name: Build Intel Mac (x86_64)

on:
  workflow_dispatch:

jobs:
  build-macos-intel:
    name: Build macOS Intel x64
    runs-on: macos-15-intel
    steps:
      - name: Check out studio-v0.5.0 tag
        uses: actions/checkout@v4
        with:
          ref: 'studio-v0.5.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS system dependencies
        run: |
          brew install create-dmg python-tk@3.12 brotli gettext inih

      - name: Convert PNG to ICNS for macOS icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build executable with PyInstaller
        run: pyinstaller RawAlchemy.spec

      - name: Verify architecture is x86_64
        run: |
          echo "Runner arch: $(uname -m)"
          lipo -archs dist/RawAlchemy.app/Contents/MacOS/RawAlchemy

      - name: Package macOS .app into .dmg
        run: |
          create-dmg \
            --volname "RawAlchemyStudio Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "RawAlchemy.app" 200 190 \
            --hide-extension "RawAlchemy.app" \
            --app-drop-link 600 185 \
            "dist/RawAlchemyStudio-studio-v0.5.0-macos-intel.dmg" \
            "dist/RawAlchemy.app"

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: RawAlchemyStudio-macos-intel-dmg
          path: dist/*.dmg
